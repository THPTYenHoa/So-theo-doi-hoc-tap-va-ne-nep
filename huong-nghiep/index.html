<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gửi câu hỏi Tư vấn hướng nghiệp · Khối 11 · THPT Yên Hòa</title>
<meta name="description" content="Học sinh và cha mẹ học sinh khối 11 THPT Yên Hòa gửi câu hỏi cho ban Tư vấn hướng nghiệp.">
<meta name="theme-color" content="#1f5f8b">
<link rel="icon" href="../img/favicon.png">
<link rel="apple-touch-icon" href="../img/logo-180.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<!-- Tư vấn hướng nghiệp K11 (16/11/2026, v4): 1 trang, không thư viện / phông ngoài để mở nhanh.
     Gửi tới yenhoa-backend ▸ hanh-kiem-11d3 ▸ HuongNghiep.gs (hnGui). Nói để viết = nhận giọng nói của chính trình duyệt / bàn phím điện thoại. -->
<style>
:root{--ink:#12324a;--pri:#1f5f8b;--pri2:#174a6d;--soft:#eaf3fa;--line:#d3dfe8;--fld:#b9c8d4;--mut:#5d6f7d;--bg:#f5f8fb;--ok:#1d7a4c;--err:#b3261e;--rec:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;gap:12px;align-items:center;padding:4px 0 12px}
.top img{width:50px;height:50px;border-radius:50%;flex:none}
.sch{font-size:12.5px;font-weight:600;color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
h1{margin:2px 0 0;font-size:20px;line-height:1.25}
.intro{margin:0 0 12px;color:var(--mut);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:0 0 12px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px rgba(179,38,30,.15)}
h2{margin:0 0 10px;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--pri);font-size:13px;flex:none}
h2 small,.f small{font-weight:400;color:var(--mut);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt{background:#fff;border:1.5px solid var(--fld);border-radius:10px}
.opt[aria-pressed=true]{border-color:var(--pri);background:var(--soft);color:var(--pri2);box-shadow:inset 0 0 0 1px var(--pri)}
.vai{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vai .opt{padding:13px 10px;text-align:left;font-weight:600}
.vai .opt span{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.lopg{margin:0 0 6px;font-size:13px;color:var(--mut)}
.lop{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 10px}
.lop .opt{padding:11px 0;font-weight:600;font-size:15px}
.cd{display:flex;flex-wrap:wrap;gap:8px}
.cd .opt{padding:8px 12px;font-size:14px;border-radius:999px}
.f{display:block;font-size:14px;color:var(--mut);margin:0 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1.5px solid var(--fld);border-radius:10px;padding:11px 12px;outline:none;-webkit-appearance:none}
input[type=text]:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,95,139,.15)}
textarea{min-height:140px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;border:1.5px solid var(--fld);background:#fff;font-weight:600}
.btn svg{width:20px;height:20px;flex:none}
.btn.on{border-color:var(--rec);color:var(--rec);background:#fdf0ef}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;width:100%;padding:15px;font-size:17px}
.btn.ghost{background:#fff;color:var(--ink);width:100%;padding:14px}
.row{display:flex;gap:10px;align-items:center;margin:10px 0 0;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin:8px 0 0}
.hint.live{color:var(--rec)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rec);display:inline-block;margin-right:4px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.err{color:var(--err);font-size:14px;margin:10px 0 0}
.need{display:none;color:var(--err);font-size:13.5px;font-weight:600;margin:8px 0 0}
.card.bad .need{display:block}
.chrome{font-size:13px;color:var(--pri2);background:var(--soft);border-radius:8px;padding:8px 10px;margin:10px 0 0}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.ov{position:fixed;inset:0;background:rgba(18,50,74,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:0}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 10px;font-size:18px}
.cf{margin:0 0 10px;font-size:16px}
.cf b{color:var(--pri2)}
.q{background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;margin:4px 0 10px}
.sheet .btn{margin-top:8px}
.done{text-align:center;padding:26px 16px}
.done .ic{width:56px;height:56px;border-radius:50%;background:#e6f4ec;color:var(--ok);display:inline-flex;align-items:center;justify-content:center}
.done .ic svg{width:30px;height:30px}
.done h2{display:block;font-size:20px;margin:12px 0 6px}
.done p{color:var(--mut);margin:0 0 14px}
.st{font-size:13px;color:var(--mut);margin:0 0 14px}
.st.ok{color:var(--ok)}
footer{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}
@media (max-width:420px){.lop{grid-template-columns:repeat(4,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../img/logo-yenhoa.webp" width="50" height="50" alt="Logo THPT Yên Hòa">
    <div><div class="sch">THPT Yên Hòa · Khối 11</div><h1>Gửi câu hỏi Tư vấn hướng nghiệp</h1></div></div>
  <main id="app"><noscript>Hãy bật JavaScript để gửi câu hỏi.</noscript></main>
  <footer>Năm học 2026-2027 · Câu hỏi được chuyển tới Ban tổ chức và ban tư vấn.</footer>
</div>
<script>
(function () {
  'use strict';
  var GAS = 'https://script.google.com/macros/s/AKfycbz1x-UG4_Rk3M3_APc-hJ0VHns2GfvPtR6T_F8nl4KlEHnNsiYGMbY0Vc4moiIRy8gO/exec';
  var LOP_A = ['11A1','11A2','11A3','11A4','11A5','11A6','11A7','11A8','11A9','11A10'];
  var LOP_D = ['11D1','11D2','11D3','11D4','11D5','11D6','11D7'];
  var CHUDE = ['Chọn ngành nghề','Trường & tuyển sinh','Tổ hợp môn, phương thức xét tuyển','Năng lực, sở thích bản thân',
               'Thị trường lao động','Du học','Học nghề, trải nghiệm nghề','Khác'];
  var OB = 'hn_k11_outbox';
  var MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  var STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';
  var OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  var st = { vai: '', lop: '', chude: [], hoi: '', ten: '', cach: '' };   // không nhớ lớp / đối tượng từ lần trước
  var app = document.getElementById('app');
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ph() { return st.vai === 'ph'; }

  function form() {
    var lb = function (l) { return '<button type="button" class="opt" data-lop="' + l + '" aria-pressed="' + (st.lop === l) + '">' + l + '</button>'; };
    app.innerHTML =
      '<p class="intro">Ngày hội Tư vấn hướng nghiệp khối 11 — thứ Bảy 28/11/2026. Câu hỏi được gửi tới ban tư vấn để chuẩn bị giải đáp.</p>' +
      '<section class="card" id="cVai"><h2><span class="n">1</span>Bạn là</h2><div class="vai">' +
        '<button type="button" class="opt" data-vai="hs" aria-pressed="' + (st.vai === 'hs') + '">Học sinh<span>khối 11</span></button>' +
        '<button type="button" class="opt" data-vai="ph" aria-pressed="' + (st.vai === 'ph') + '">Cha mẹ học sinh<span>phụ huynh học sinh khối 11</span></button>' +
      '</div><div class="need">Bắt buộc: hãy chọn Học sinh hoặc Cha mẹ học sinh.</div></section>' +
      '<section class="card" id="cLop"><h2><span class="n">2</span>Lớp <small id="lopNote">' + (ph() ? '(lớp của con)' : '') + '</small></h2>' +
        '<div class="lopg">Ban A</div><div class="lop">' + LOP_A.map(lb).join('') + '</div>' +
        '<div class="lopg">Ban D</div><div class="lop">' + LOP_D.map(lb).join('') + '</div><div class="need">Bắt buộc: hãy chọn lớp.</div></section>' +
      '<section class="card"><h2><span class="n">3</span>Chủ đề <small>(không bắt buộc, chọn được nhiều)</small></h2><div class="cd">' +
        CHUDE.map(function (c) { return '<button type="button" class="opt" data-cd="' + esc(c) + '" aria-pressed="' + (st.chude.indexOf(c) >= 0) + '">' + esc(c) + '</button>'; }).join('') +
      '</div></section>' +
      '<section class="card" id="cHoi"><h2><span class="n">4</span>Câu hỏi</h2>' +
        '<textarea id="hoi" maxlength="3000" placeholder="Viết câu hỏi gửi ban tư vấn…">' + esc(st.hoi) + '</textarea>' +
        '<div class="row"><button type="button" class="btn" id="bNoi">' + MIC + '<span>Nói để viết</span></button></div>' +
        '<div class="need">Bắt buộc: hãy viết hoặc nói câu hỏi.</div>' +
        '<div class="hint" id="hNoi">Gõ chữ như bình thường, hoặc bấm <b>Nói để viết</b> rồi nói.</div>' +
        '<div class="chrome">Lưu ý: để dùng <b>Nói để viết</b>, hãy mở link bằng trình duyệt <b>Chrome</b>. Trên iPhone có thể bấm biểu tượng micro trên bàn phím để nói.</div>' +
        '<label class="f" for="ten" style="margin-top:14px">Họ tên <small>(không bắt buộc — có thể để trống)</small></label>' +
        '<input type="text" id="ten" maxlength="80" autocomplete="name" value="' + esc(st.ten) + '">' +
        '<div class="hp" aria-hidden="true"><input type="text" id="web" tabindex="-1" autocomplete="off"></div>' +
      '</section>' +
      '<button type="button" class="btn pri" id="bGui">Gửi câu hỏi</button><div class="err" id="err" role="alert"></div>';
    wire();
  }

  function wire() {
    app.querySelectorAll('[data-vai]').forEach(function (b) { b.onclick = function () {
      st.vai = b.getAttribute('data-vai');
      app.querySelectorAll('[data-vai]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('#lopNote').textContent = ph() ? '(lớp của con)' : ''; $('#cVai').classList.remove('bad'); $('#err').textContent = '';
    }; });
    app.querySelectorAll('[data-lop]').forEach(function (b) { b.onclick = function () {
      st.lop = b.getAttribute('data-lop');
      app.querySelectorAll('[data-lop]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('#cLop').classList.remove('bad'); $('#err').textContent = '';
    }; });
    app.querySelectorAll('[data-cd]').forEach(function (b) { b.onclick = function () {
      var c = b.getAttribute('data-cd'), i = st.chude.indexOf(c);
      if (i >= 0) st.chude.splice(i, 1); else st.chude.push(c);
      b.setAttribute('aria-pressed', String(i < 0));
    }; });
    $('#hoi').oninput = function () { st.hoi = this.value; if (!st.cach) st.cach = 'go'; $('#cHoi').classList.remove('bad'); };
    $('#ten').oninput = function () { st.ten = this.value; };
    $('#bNoi').onclick = noi;
    $('#bGui').onclick = kiem;
  }

  /* ---------- Nói để viết: nhận giọng nói ngay trên điện thoại (không qua máy chủ) ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
  function hint(h, live) { var x = $('#hNoi'); x.innerHTML = h; x.classList.toggle('live', !!live); }
  function btnNoi(on) { $('#bNoi').classList.toggle('on', on); $('#bNoi').innerHTML = (on ? STOP : MIC) + '<span>' + (on ? 'Dừng nói' : 'Nói để viết') + '</span>'; }
  var KB = 'Hãy bấm <b>biểu tượng micro trên bàn phím</b> điện thoại (cạnh phím cách) rồi nói — chữ sẽ hiện vào ô.';
  function noi() {
    if (rec) { rec.stop(); return; }
    var ta = $('#hoi');
    if (!SR) { ta.focus(); hint(KB, false); return; }
    var base = ta.value.replace(/\s+$/, ''), fin = '';
    if (base) base += ' ';
    try { rec = new SR(); } catch (e) { rec = null; ta.focus(); hint(KB, false); return; }
    rec.lang = 'vi-VN'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function (ev) {
      var tmp = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript.trim() + ' ';
        else tmp += ev.results[i][0].transcript;
      }
      ta.value = base + fin + tmp; st.hoi = ta.value; st.cach = base ? 'gonoi' : 'noi'; $('#cHoi').classList.remove('bad');
    };
    rec.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') { ta.focus(); hint('Chưa dùng được micro cho trang này. ' + KB, false); }
      else if (ev.error === 'no-speech') hint('Chưa nghe thấy tiếng — bấm <b>Nói để viết</b> và nói lại nhé.', false);
      else if (ev.error === 'network') hint('Mạng yếu nên chưa nhận được giọng nói. ' + KB, false);
    };
    rec.onend = function () {
      rec = null; btnNoi(false);
      ta.value = ta.value.replace(/\s+$/, ''); st.hoi = ta.value;
      if ($('#hNoi').classList.contains('live')) hint('Đã dừng. Đọc lại và sửa chữ nếu cần; bấm <b>Nói để viết</b> để nói tiếp.', false);
    };
    try { rec.start(); } catch (e) { rec = null; ta.focus(); hint(KB, false); return; }
    btnNoi(true); hint('<span class="dot"></span>Đang nghe… nói xong bấm <b>Dừng nói</b>.', true);
  }

  /* ---------- Kiểm tra ⇒ xác nhận ⇒ gửi ---------- */
  function kiem() {
    if (rec) rec.stop();
    st.hoi = $('#hoi').value.trim(); st.ten = $('#ten').value.trim();
    var miss = [];
    [['#cVai', !st.vai, 'Bạn là'], ['#cLop', !st.lop, 'Lớp'], ['#cHoi', st.hoi.length < 3, 'Câu hỏi']].forEach(function (c) {
      $(c[0]).classList.toggle('bad', c[1]); if (c[1]) miss.push(c);
    });
    if (miss.length) {
      $('#err').textContent = 'Còn thiếu: ' + miss.map(function (c) { return c[2]; }).join(', ') + ' — hãy điền đủ trước khi gửi.';
      $(miss[0][0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    $('#err').textContent = '';
    var x = ph() ? 'bác' : 'em';
    var ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h3>Xác nhận trước khi gửi</h3>' +
      '<p class="cf">' + (ph() ? 'Bác là <b>phụ huynh của học sinh lớp ' + st.lop + '</b>.' : 'Em là <b>học sinh lớp ' + st.lop + '</b>.') + '</p>' +
      '<div class="cf">Câu hỏi ' + x + ' dành cho ban tư vấn hướng nghiệp:</div><div class="q">' + esc(st.hoi) + '</div>' +
      '<p class="cf">Chủ đề tập trung vào: <b>' + (st.chude.length ? esc(st.chude.join(', ')) : '(không chọn)') + '</b></p>' +
      (st.ten ? '<p class="cf">Họ tên: <b>' + esc(st.ten) + '</b></p>' : '') +
      '<button type="button" class="btn pri" id="ok">Đúng, gửi câu hỏi</button>' +
      '<button type="button" class="btn ghost" id="sua">Sửa lại</button></div>';
    document.body.appendChild(ov);
    var close = function () { ov.remove(); };
    ov.onclick = function (e) { if (e.target === ov) close(); };
    ov.querySelector('#sua').onclick = close;
    ov.querySelector('#ok').onclick = function () { close(); gui(); };
  }

  /* gửi ngay trên giao diện; lệnh ghi chạy nền, lưu tạm trên máy nếu mạng yếu (máy chủ chống trùng theo rid) */
  function obGet() { try { return JSON.parse(localStorage.getItem(OB) || '[]'); } catch (e) { return []; } }
  function obSet(a) { try { localStorage.setItem(OB, JSON.stringify(a)); } catch (e) {} }
  function gui() {
    var p = { vai: st.vai, lop: st.lop, ten: st.ten, chude: st.chude.slice(), hoi: st.hoi, cach: st.cach || 'go',
              web: $('#web').value, rid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) };
    var a = obGet(); a.push(p); obSet(a);
    done(p);
    flush();
  }
  var running = false, tries = 0;
  function flush() {
    if (running) return;
    var a = obGet(); if (!a.length) return;
    running = true;
    var p = a[0];
    fetch(GAS, { method: 'POST', redirect: 'follow', keepalive: JSON.stringify(p).length < 60000,
                 headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'hnGui', payload: p }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        running = false;
        if (j && j.ok) {
          tries = 0; obSet(obGet().filter(function (x) { return x.rid !== p.rid; })); status(p.rid, 'ok'); flush();
        } else {                                                        // lỗi dữ liệu (hiếm) ⇒ bỏ, báo người gửi
          obSet(obGet().filter(function (x) { return x.rid !== p.rid; })); status(p.rid, 'bad', (j && j.error) || '');
        }
      })
      .catch(function () { running = false; tries++; status(p.rid, 'wait'); setTimeout(flush, Math.min(30000, 2000 * tries)); });
  }
  function status(rid, s, msg) {
    var el = document.querySelector('[data-rid="' + rid + '"]'); if (!el) return;
    el.className = 'st' + (s === 'ok' ? ' ok' : '');
    el.textContent = s === 'ok' ? '✓ Đã lưu vào danh sách câu hỏi.' : s === 'wait' ? 'Mạng yếu — câu hỏi được giữ trên máy và tự gửi lại khi có mạng (đừng xoá dữ liệu trình duyệt).'
      : 'Chưa lưu được: ' + msg + ' Hãy bấm "Gửi thêm câu hỏi" và gửi lại.';
  }
  function done(p) {
    var x = ph() ? 'bác' : 'em';
    app.innerHTML = '<section class="card done"><div class="ic">' + OK + '</div><h2>Đã gửi câu hỏi</h2>' +
      '<p>Cảm ơn ' + x + ' (' + (ph() ? 'phụ huynh học sinh' : 'học sinh') + ' lớp ' + p.lop + '). Ban tư vấn sẽ tổng hợp và giải đáp trong Ngày hội Tư vấn hướng nghiệp 28/11/2026.</p>' +
      '<div class="st" data-rid="' + p.rid + '">Đang lưu…</div>' +
      '<button type="button" class="btn pri" id="bThem">Gửi thêm câu hỏi khác</button></section>';
    $('#bThem').onclick = function () { st.hoi = ''; st.chude = []; st.cach = ''; form(); window.scrollTo(0, 0); };
    window.scrollTo(0, 0);
  }

  form();
  window.addEventListener('online', flush);
  setTimeout(function () {
    flush();                                                            // câu hỏi còn kẹt từ lần trước
    try { fetch(GAS + '?action=ping', { mode: 'no-cors' }); } catch (e) {}   // đánh thức máy chủ trước khi gửi
